<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="recall@5 taqqoslash: hybrid 0.95, sparse 0.70, dense 0.52">
  <title>Nega gibrid qidiruv</title>
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161514"/>
      <stop offset="1" stop-color="#1D1B1A"/>
    </linearGradient>
    <linearGradient id="c-hy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3E9E82"/>
      <stop offset="1" stop-color="#62C5EE"/>
    </linearGradient>
    <linearGradient id="c-sp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0088B0"/>
      <stop offset="1" stop-color="#62C5EE"/>
    </linearGradient>
    <linearGradient id="c-dn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57524E"/>
      <stop offset="1" stop-color="#6E6A67"/>
    </linearGradient>
    <linearGradient id="c-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c-card"><rect width="900" height="360" rx="18"/></clipPath>
    <clipPath id="c-hybar"><rect x="200" y="104" width="532" height="34" rx="17"/></clipPath>
    <style>
      .f { font-family: "Segoe UI", Inter, Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif; }
      .bar { transform-box: fill-box; transform-origin: left center; animation: grow 8s cubic-bezier(.2,.85,.25,1) infinite; }
      .b2 { animation-delay: .22s } .b3 { animation-delay: .44s }
      @keyframes grow { 0%{transform:scaleX(0)} 3%{transform:scaleX(0)} 26%{transform:scaleX(1)} 93%{transform:scaleX(1)} 100%{transform:scaleX(0)} }

      .val { opacity:0; animation: vin 8s ease-out infinite; }
      .v2 { animation-delay: .22s } .v3 { animation-delay: .44s }
      @keyframes vin { 0%,20%{opacity:0} 30%{opacity:1} 93%{opacity:1} 100%{opacity:0} }

      .shine { animation: sh 8s linear infinite; }
      @keyframes sh { 0%,26%{transform:translateX(-140px)} 55%{transform:translateX(560px)} 100%{transform:translateX(560px)} }

      .note { opacity:0; animation: nin 8s ease-out infinite; }
      @keyframes nin { 0%,40%{opacity:0;transform:translateY(6px)} 50%{opacity:1;transform:translateY(0)} 93%{opacity:1} 100%{opacity:0} }
    </style>
  </defs>

  <g clip-path="url(#c-card)">
    <rect width="900" height="360" fill="url(#c-bg)"/>
    <rect x="0.75" y="0.75" width="898.5" height="358.5" rx="17" fill="none" stroke="#353130" stroke-width="1.5"/>

    <text class="f" x="40" y="46" font-size="20" font-weight="700" fill="#EDEBE9">recall@5 — qidiruv usuli bo'yicha</text>
    <text class="f" x="40" y="70" font-size="13.5" fill="#948F8B">Bir xil 73 savol · bir xil korpus · faqat qidiruv usuli farq qiladi</text>

    <!-- grid -->
    <g stroke="#2C2927" stroke-width="1">
      <line x1="200" y1="92" x2="200" y2="290"/>
      <line x1="333" y1="92" x2="333" y2="290" stroke-dasharray="3 5"/>
      <line x1="466" y1="92" x2="466" y2="290" stroke-dasharray="3 5"/>
      <line x1="599" y1="92" x2="599" y2="290" stroke-dasharray="3 5"/>
      <line x1="732" y1="92" x2="732" y2="290"/>
    </g>
    <g class="f" font-size="11" fill="#615C58" text-anchor="middle">
      <text x="200" y="308">0</text>
      <text x="333" y="308">0.25</text>
      <text x="466" y="308">0.50</text>
      <text x="599" y="308">0.75</text>
      <text x="732" y="308">1.00</text>
    </g>

    <!-- hybrid -->
    <text class="f" x="182" y="127" font-size="15" font-weight="700" fill="#E4EFEA" text-anchor="end">hybrid</text>
    <text class="f" x="182" y="144" font-size="11" fill="#787471" text-anchor="end">dense + sparse · RRF</text>
    <rect x="200" y="104" width="532" height="34" rx="17" fill="#201E1D"/>
    <rect class="bar" x="200" y="104" width="505.4" height="34" rx="17" fill="url(#c-hy)"/>
    <g clip-path="url(#c-hybar)">
      <rect class="shine" x="200" y="104" width="110" height="34" fill="url(#c-shine)"/>
    </g>
    <text class="f val" x="692" y="128" font-size="19" font-weight="800" fill="#17201D" text-anchor="end">0.95</text>

    <!-- sparse -->
    <text class="f" x="182" y="181" font-size="15" font-weight="700" fill="#D6D2CE" text-anchor="end">sparse</text>
    <text class="f" x="182" y="198" font-size="11" fill="#787471" text-anchor="end">faqat BM25</text>
    <rect x="200" y="158" width="532" height="34" rx="17" fill="#201E1D"/>
    <rect class="bar b2" x="200" y="158" width="372.4" height="34" rx="17" fill="url(#c-sp)"/>
    <text class="f val v2" x="592" y="181" font-size="17" font-weight="700" fill="#B0ABA7">0.70</text>

    <!-- dense -->
    <text class="f" x="182" y="235" font-size="15" font-weight="700" fill="#D6D2CE" text-anchor="end">dense</text>
    <text class="f" x="182" y="252" font-size="11" fill="#787471" text-anchor="end">faqat vektor</text>
    <rect x="200" y="212" width="532" height="34" rx="17" fill="#201E1D"/>
    <rect class="bar b3" x="200" y="212" width="276.6" height="34" rx="17" fill="url(#c-dn)"/>
    <text class="f val v3" x="496" y="235" font-size="17" font-weight="700" fill="#948F8B">0.52</text>

    <!-- note -->
    <g class="note">
      <rect x="200" y="322" width="668" height="1" fill="#2C2927"/>
      <text class="f" x="40" y="340" font-size="13" fill="#A8A39F">
        <tspan fill="#69C7AC" font-weight="700">Modda raqamli savollarda</tspan> farq eng keskin: hybrid <tspan font-weight="700" fill="#EDEBE9">1.00</tspan> · dense <tspan font-weight="700" fill="#D9705F">0.13</tspan> — vektor qidiruv "125-modda" ni tushunmaydi
      </text>
    </g>
  </g>
</svg>
