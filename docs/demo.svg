<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" role="img" aria-label="Huquq AI demo — savol, gibrid qidiruv, manbali javob">
  <title>Savoldan manbali javobgacha</title>
  <defs>
    <linearGradient id="d-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1D"/>
      <stop offset="1" stop-color="#0E1530"/>
    </linearGradient>
    <linearGradient id="d-user" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B5BFD"/>
      <stop offset="1" stop-color="#6D4AEF"/>
    </linearGradient>
    <linearGradient id="d-track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B5BFD"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <clipPath id="d-card"><rect width="900" height="570" rx="18"/></clipPath>
    <filter id="d-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <mask id="d-q"><rect class="rv q" x="534" y="76" width="306" height="26" fill="#fff"/></mask>
    <mask id="d-l1"><rect class="rv l1" x="62" y="204" width="466" height="24" fill="#fff"/></mask>
    <mask id="d-l2"><rect class="rv l2" x="62" y="230" width="400" height="24" fill="#fff"/></mask>
    <mask id="d-l3"><rect class="rv l3" x="62" y="256" width="432" height="24" fill="#fff"/></mask>
    <mask id="d-l4"><rect class="rv l4" x="62" y="282" width="366" height="24" fill="#fff"/></mask>
    <mask id="d-l5"><rect class="rv l5" x="62" y="308" width="410" height="24" fill="#fff"/></mask>
    <mask id="d-l6"><rect class="rv l6" x="62" y="334" width="376" height="24" fill="#fff"/></mask>

    <style>
      .f { font-family: "Segoe UI", Inter, Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif; }
      .stage { animation: stage 15s linear infinite; }
      @keyframes stage { 0%{opacity:0} 1.5%{opacity:1} 95%{opacity:1} 99%{opacity:0} 100%{opacity:0} }

      .rv { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation-duration: 15s; animation-iteration-count: infinite; animation-timing-function: linear; }
      .q  { animation-name: kq }
      .l1 { animation-name: k1 } .l2 { animation-name: k2 } .l3 { animation-name: k3 }
      .l4 { animation-name: k4 } .l5 { animation-name: k5 } .l6 { animation-name: k6 }
      @keyframes kq { 0%,3%{transform:scaleX(0)} 15%{transform:scaleX(1)} 100%{transform:scaleX(1)} }
      @keyframes k1 { 0%,40%{transform:scaleX(0)} 44%{transform:scaleX(1)} 100%{transform:scaleX(1)} }
      @keyframes k2 { 0%,45%{transform:scaleX(0)} 49%{transform:scaleX(1)} 100%{transform:scaleX(1)} }
      @keyframes k3 { 0%,50%{transform:scaleX(0)} 54%{transform:scaleX(1)} 100%{transform:scaleX(1)} }
      @keyframes k4 { 0%,55%{transform:scaleX(0)} 59%{transform:scaleX(1)} 100%{transform:scaleX(1)} }
      @keyframes k5 { 0%,60%{transform:scaleX(0)} 64%{transform:scaleX(1)} 100%{transform:scaleX(1)} }
      @keyframes k6 { 0%,65%{transform:scaleX(0)} 69%{transform:scaleX(1)} 100%{transform:scaleX(1)} }

      .qbub { opacity:0; animation: pop 15s ease-out infinite; transform-box: fill-box; }
      @keyframes pop { 0%,2%{opacity:0;transform:translateY(8px)} 5%{opacity:1;transform:translateY(0)} 100%{opacity:1;transform:translateY(0)} }

      .abub { opacity:0; animation: pop2 15s ease-out infinite; transform-box: fill-box; }
      @keyframes pop2 { 0%,38%{opacity:0;transform:translateY(8px)} 41%{opacity:1;transform:translateY(0)} 100%{opacity:1;transform:translateY(0)} }

      .pill { opacity:.28; animation-duration:15s; animation-iteration-count:infinite; animation-timing-function:ease-out; }
      .p1{animation-name:pv1} .p2{animation-name:pv2} .p3{animation-name:pv3} .p4{animation-name:pv4} .p5{animation-name:pv5}
      @keyframes pv1 { 0%,19%{opacity:.28} 22%{opacity:1} 100%{opacity:1} }
      @keyframes pv2 { 0%,23%{opacity:.28} 26%{opacity:1} 100%{opacity:1} }
      @keyframes pv3 { 0%,23%{opacity:.28} 26%{opacity:1} 100%{opacity:1} }
      @keyframes pv4 { 0%,29%{opacity:.28} 32%{opacity:1} 100%{opacity:1} }
      @keyframes pv5 { 0%,33%{opacity:.28} 36%{opacity:1} 100%{opacity:1} }

      .spark { opacity:0; animation: spk 15s linear infinite; }
      @keyframes spk { 0%,18%{opacity:0;transform:translateX(0)} 20%{opacity:1} 37%{opacity:1;transform:translateX(682px)} 40%{opacity:0;transform:translateX(682px)} 100%{opacity:0;transform:translateX(682px)} }

      .src { opacity:0; animation-duration:15s; animation-iteration-count:infinite; animation-timing-function:cubic-bezier(.2,.8,.2,1); transform-box: fill-box; }
      .s1 { animation-name: sv1 } .s2 { animation-name: sv2 }
      @keyframes sv1 { 0%,73%{opacity:0;transform:translateY(14px)} 77%{opacity:1;transform:translateY(0)} 100%{opacity:1;transform:translateY(0)} }
      @keyframes sv2 { 0%,77%{opacity:0;transform:translateY(14px)} 81%{opacity:1;transform:translateY(0)} 100%{opacity:1;transform:translateY(0)} }

      .lbl { opacity:0; animation: lb 15s linear infinite; }
      @keyframes lb { 0%,71%{opacity:0} 74%{opacity:1} 100%{opacity:1} }

      .fpanel { opacity:0; animation: fp 15s ease-out infinite; transform-box: fill-box; }
      @keyframes fp { 0%,20%{opacity:0;transform:translateY(8px)} 24%{opacity:1;transform:translateY(0)} 100%{opacity:1;transform:translateY(0)} }
      .fbar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
              animation-duration:15s; animation-iteration-count:infinite; animation-timing-function:cubic-bezier(.2,.85,.25,1); }
      .f1{animation-name:fb1} .f2{animation-name:fb2} .f3{animation-name:fb3} .f4{animation-name:fb4}
      @keyframes fb1 { 0%,24%{transform:scaleX(0)} 29%{transform:scaleX(1)} 100%{transform:scaleX(1)} }
      @keyframes fb2 { 0%,27%{transform:scaleX(0)} 32%{transform:scaleX(1)} 100%{transform:scaleX(1)} }
      @keyframes fb3 { 0%,31%{transform:scaleX(0)} 36%{transform:scaleX(1)} 100%{transform:scaleX(1)} }
      @keyframes fb4 { 0%,36%{transform:scaleX(0)} 41%{transform:scaleX(1)} 100%{transform:scaleX(1)} }

      .think { animation: th 1.1s ease-in-out infinite; }
      .th2 { animation-delay: .18s } .th3 { animation-delay: .36s }
      @keyframes th { 0%,100%{opacity:.25} 50%{opacity:1} }
      .thinkwrap { animation: tw 15s linear infinite; }
      @keyframes tw { 0%,17%{opacity:0} 19%{opacity:1} 38%{opacity:1} 40%{opacity:0} 100%{opacity:0} }
    </style>
  </defs>

  <g clip-path="url(#d-card)">
    <rect width="900" height="570" fill="url(#d-bg)"/>
    <rect x="0.75" y="0.75" width="898.5" height="568.5" rx="17" fill="none" stroke="#25315C" stroke-width="1.5"/>

    <!-- title bar -->
    <rect width="900" height="46" fill="#0B1226"/>
    <line x1="0" y1="46" x2="900" y2="46" stroke="#222E56"/>
    <circle cx="28" cy="23" r="5" fill="#F87171"/>
    <circle cx="46" cy="23" r="5" fill="#FBBF24"/>
    <circle cx="64" cy="23" r="5" fill="#4ADE80"/>
    <text class="f" x="88" y="28" font-size="13.5" font-weight="600" fill="#8598C9">Huquq AI · umumiy rejim</text>
    <g class="f" font-size="11.5" font-weight="700">
      <rect x="762" y="12" width="112" height="23" rx="11.5" fill="#122A1E" stroke="#1F5138"/>
      <circle cx="777" cy="23.5" r="3.5" fill="#4ADE80"/>
      <text x="788" y="28" fill="#6EE7A8">grounded</text>
    </g>

    <g class="stage">
      <!-- user question -->
      <g class="qbub">
        <rect x="510" y="62" width="352" height="50" rx="15" fill="url(#d-user)"/>
        <text class="f" x="534" y="94" font-size="17" fill="#fff" mask="url(#d-q)" textLength="304" lengthAdjust="spacing">O'g'irlik uchun qanday jazo belgilangan?</text>
      </g>

      <!-- pipeline strip -->
      <g class="f" font-size="12" font-weight="600">
        <line x1="60" y1="145" x2="742" y2="145" stroke="#1E2A50" stroke-width="2"/>
        <g class="spark" filter="url(#d-glow)">
          <circle cx="60" cy="145" r="6" fill="#7DD3FC"/>
        </g>
        <g class="spark">
          <circle cx="60" cy="145" r="3.2" fill="#ffffff"/>
        </g>
        <g fill="#141F45">
          <rect x="40" y="128" width="150" height="34" rx="17"/>
          <rect x="204" y="128" width="118" height="34" rx="17"/>
          <rect x="336" y="128" width="142" height="34" rx="17"/>
          <rect x="492" y="128" width="86" height="34" rx="17"/>
          <rect x="592" y="128" width="150" height="34" rx="17"/>
        </g>
        <g class="pill p1">
          <rect x="40" y="128" width="150" height="34" rx="17" fill="#141F45" stroke="#3B5BFD"/>
          <text x="115" y="150" fill="#B9C8F2" text-anchor="middle">modda detektori</text>
        </g>
        <g class="pill p2">
          <rect x="204" y="128" width="118" height="34" rx="17" fill="#141F45" stroke="#4F7BFF"/>
          <text x="263" y="150" fill="#B9C8F2" text-anchor="middle">dense · e5</text>
        </g>
        <g class="pill p3">
          <rect x="336" y="128" width="142" height="34" rx="17" fill="#141F45" stroke="#22D3EE"/>
          <text x="407" y="150" fill="#B9C8F2" text-anchor="middle">sparse · BM25</text>
        </g>
        <g class="pill p4">
          <rect x="492" y="128" width="86" height="34" rx="17" fill="#141F45" stroke="#34D399"/>
          <text x="535" y="150" fill="#B9C8F2" text-anchor="middle">RRF</text>
        </g>
        <g class="pill p5">
          <rect x="592" y="128" width="150" height="34" rx="17" fill="#141F45" stroke="#A78BFA"/>
          <text x="667" y="150" fill="#B9C8F2" text-anchor="middle">rerank → top-4</text>
        </g>
      </g>

      <!-- thinking dots -->
      <g class="thinkwrap">
        <circle class="think" cx="790" cy="145" r="4.2" fill="#7E92C9"/>
        <circle class="think th2" cx="808" cy="145" r="4.2" fill="#7E92C9"/>
        <circle class="think th3" cx="826" cy="145" r="4.2" fill="#7E92C9"/>
      </g>

      <!-- answer bubble -->
      <g class="abub">
        <rect x="40" y="182" width="530" height="192" rx="15" fill="#111A34" stroke="#26325C"/>
        <rect x="40" y="182" width="4" height="192" rx="2" fill="#3B5BFD"/>
        <g class="f" font-size="16" fill="#D3DDF5">
          <text x="62" y="222" mask="url(#d-l1)" textLength="464" lengthAdjust="spacing">O'g'irlik — o'zganing mol-mulkini yashirincha talon-toroj qilish —</text>
          <text x="62" y="248" mask="url(#d-l2)" textLength="398" lengthAdjust="spacing">Jinoyat kodeksining 169-moddasi bilan tartibga solinadi.</text>
          <text x="62" y="274" mask="url(#d-l3)" textLength="430" lengthAdjust="spacing">Jazo qilmish belgilariga qarab jarimadan ozodlikdan mahrum</text>
          <text x="62" y="300" mask="url(#d-l4)" textLength="364" lengthAdjust="spacing">qilishgacha o'zgaradi (Jinoyat kodeksi, 169-modda).</text>
          <text x="62" y="326" mask="url(#d-l5)" textLength="408" lengthAdjust="spacing">Sud jazo tayinlashda yengillashtiruvchi va og'irlashtiruvchi</text>
          <text x="62" y="352" mask="url(#d-l6)" textLength="374" lengthAdjust="spacing">holatlarni hisobga oladi (Jinoyat kodeksi, 54-modda).</text>
        </g>
      </g>

      <!-- candidate funnel -->
      <g class="fpanel">
        <rect x="596" y="182" width="266" height="192" rx="15" fill="#0E1730" stroke="#26325C"/>
        <text class="f" x="618" y="210" font-size="11" font-weight="700" fill="#7E92C9" letter-spacing="1.8">NOMZODLAR</text>
        <g class="f" font-size="12.5" fill="#9FB0DA">
          <text x="618" y="240">dense · e5</text>
          <text x="840" y="240" font-weight="700" fill="#CBD8F5" text-anchor="end">20</text>
          <rect x="618" y="248" width="222" height="4" rx="2" fill="#18234A"/>
          <rect class="fbar f1" x="618" y="248" width="130" height="4" rx="2" fill="#4F7BFF"/>

          <text x="618" y="278">sparse · BM25</text>
          <text x="840" y="278" font-weight="700" fill="#CBD8F5" text-anchor="end">20</text>
          <rect x="618" y="286" width="222" height="4" rx="2" fill="#18234A"/>
          <rect class="fbar f2" x="618" y="286" width="130" height="4" rx="2" fill="#22D3EE"/>

          <text x="618" y="316">RRF birlashma</text>
          <text x="840" y="316" font-weight="700" fill="#CBD8F5" text-anchor="end">20</text>
          <rect x="618" y="324" width="222" height="4" rx="2" fill="#18234A"/>
          <rect class="fbar f3" x="618" y="324" width="130" height="4" rx="2" fill="#34D399"/>

          <text x="618" y="354">rerank → javob</text>
          <text x="840" y="354" font-weight="700" fill="#6EE7A8" text-anchor="end">4</text>
          <rect x="618" y="362" width="222" height="4" rx="2" fill="#18234A"/>
          <rect class="fbar f4" x="618" y="362" width="27" height="4" rx="2" fill="#A78BFA"/>
        </g>
      </g>

      <!-- sources -->
      <text class="f lbl" x="40" y="404" font-size="11.5" font-weight="700" fill="#7E92C9" letter-spacing="1.8">MANBALAR</text>
      <g class="src s1">
        <rect x="40" y="416" width="822" height="46" rx="11" fill="#101830" stroke="#2A3760"/>
        <text class="f" x="60" y="437" font-size="14" font-weight="700" fill="#8FB4FF">Jinoyat kodeksi · 169-modda</text>
        <text class="f" x="60" y="453" font-size="12.5" fill="#7887B0">O'g'rilik · lex.uz/uz/docs/-111453#-263768</text>
        <text class="f" x="838" y="444" font-size="14" fill="#5C6E9E" text-anchor="end">↗</text>
      </g>
      <g class="src s2">
        <rect x="40" y="470" width="822" height="46" rx="11" fill="#101830" stroke="#2A3760"/>
        <text class="f" x="60" y="491" font-size="14" font-weight="700" fill="#8FB4FF">Jinoyat kodeksi · 54-modda</text>
        <text class="f" x="60" y="507" font-size="12.5" fill="#7887B0">Jazo tayinlashning umumiy asoslari · lex.uz/uz/docs/-111453#-184674</text>
        <text class="f" x="838" y="498" font-size="14" fill="#5C6E9E" text-anchor="end">↗</text>
      </g>
    </g>

    <text class="f" x="450" y="546" font-size="12" fill="#5C6E9E" text-anchor="middle" font-style="italic">Javoblar tavsiyaviy xarakterga ega — aniq maslahat uchun yuristga murojaat qiling</text>
  </g>
</svg>
