<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Huquq AI — O'zbekiston qonunchiligi bo'yicha hybrid-RAG tizimi">
  <title>Huquq AI</title>
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1918"/>
      <stop offset="0.45" stop-color="#232120"/>
      <stop offset="1" stop-color="#151413"/>
    </linearGradient>
    <linearGradient id="h-logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E93BA"/>
      <stop offset="1" stop-color="#3FAFD6"/>
    </linearGradient>
    <linearGradient id="h-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FB89B"/>
      <stop offset="1" stop-color="#62C5EE"/>
    </linearGradient>
    <linearGradient id="h-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="h-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E93BA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0E93BA" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3FAFD6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="h-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#62C5EE" opacity="0.10"/>
    </pattern>
    <filter id="h-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <clipPath id="h-card"><rect x="0" y="0" width="1200" height="340" rx="22"/></clipPath>
    <mask id="h-sweepmask">
      <rect class="hsweep" x="-320" y="60" width="300" height="110" fill="url(#h-sweep)"/>
    </mask>
    <mask id="h-t1"><rect class="rev r1" x="150" y="176" width="412" height="30" fill="#fff"/></mask>
    <mask id="h-t2"><rect class="rev r2" x="150" y="176" width="372" height="30" fill="#fff"/></mask>
    <mask id="h-t3"><rect class="rev r3" x="150" y="176" width="328" height="30" fill="#fff"/></mask>

    <style>
      .f { font-family: "Segoe UI", Inter, Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif; }
      /* the wordmark is set in the identity's serif, with AI carrying the accent */
      .s { font-family: "Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif; }
      .rev { transform-box: fill-box; transform-origin: left center; }
      .r1 { animation: rv1 12s linear infinite; }
      .r2 { animation: rv2 12s linear infinite; }
      .r3 { animation: rv3 12s linear infinite; }
      @keyframes rv1 { 0%{transform:scaleX(0)} 8.3%{transform:scaleX(1)} 29.1%{transform:scaleX(1)} 33.3%{transform:scaleX(0)} 100%{transform:scaleX(0)} }
      @keyframes rv2 { 0%,33.3%{transform:scaleX(0)} 41.6%{transform:scaleX(1)} 62.4%{transform:scaleX(1)} 66.6%{transform:scaleX(0)} 100%{transform:scaleX(0)} }
      @keyframes rv3 { 0%,66.6%{transform:scaleX(0)} 74.9%{transform:scaleX(1)} 95.7%{transform:scaleX(1)} 100%{transform:scaleX(0)} }

      .win { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: step-end; }
      .w1 { animation-name: wv1; } .w2 { animation-name: wv2; } .w3 { animation-name: wv3; }
      @keyframes wv1 { 0%{opacity:1} 33.2%{opacity:1} 33.3%{opacity:0} 100%{opacity:0} }
      @keyframes wv2 { 0%{opacity:0} 33.3%{opacity:1} 66.5%{opacity:1} 66.6%{opacity:0} 100%{opacity:0} }
      @keyframes wv3 { 0%{opacity:0} 66.6%{opacity:1} 100%{opacity:1} }

      .caret { animation: blink 1.05s steps(1) infinite; }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .cw { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: linear; }
      .c1 { animation-name: cv1; } .c2 { animation-name: cv2; } .c3 { animation-name: cv3; }
      @keyframes cv1 { 0%{transform:translateX(0)} 8.3%{transform:translateX(412px)} 29.1%{transform:translateX(412px)} 33.3%{transform:translateX(0)} 100%{transform:translateX(0)} }
      @keyframes cv2 { 0%,33.3%{transform:translateX(0)} 41.6%{transform:translateX(372px)} 62.4%{transform:translateX(372px)} 66.6%{transform:translateX(0)} 100%{transform:translateX(0)} }
      @keyframes cv3 { 0%,66.6%{transform:translateX(0)} 74.9%{transform:translateX(328px)} 95.7%{transform:translateX(328px)} 100%{transform:translateX(0)} }

      .hsweep { animation: sweep 6.5s cubic-bezier(.5,0,.5,1) infinite; }
      @keyframes sweep { 0%{transform:translateX(0)} 45%{transform:translateX(1000px)} 100%{transform:translateX(1000px)} }

      .blob1 { animation: fl1 16s ease-in-out infinite; }
      .blob2 { animation: fl2 19s ease-in-out infinite; }
      @keyframes fl1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(70px,34px)} }
      @keyframes fl2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-60px,-28px)} }

      .arc { stroke-dasharray: 427.3; stroke-dashoffset: 427.3; animation: fill 3.6s cubic-bezier(.2,.8,.2,1) infinite; }
      @keyframes fill { 0%{stroke-dashoffset:427.3} 30%{stroke-dashoffset:21.4} 88%{stroke-dashoffset:21.4} 100%{stroke-dashoffset:427.3} }
      .spin { animation: sp 22s linear infinite; transform-origin: 1032px 170px; }
      @keyframes sp { to { transform: rotate(360deg) } }
      .pulse { animation: pl 3.6s ease-in-out infinite; transform-origin: 1032px 170px; }
      @keyframes pl { 0%,100%{opacity:.25;transform:scale(1)} 40%{opacity:.05;transform:scale(1.12)} }

      .chip { opacity: 0; animation: rise 12s ease-out infinite; transform-box: fill-box; }
      .k1 { animation-delay: .15s } .k2 { animation-delay: .35s } .k3 { animation-delay: .55s } .k4 { animation-delay: .75s }
      @keyframes rise { 0%{opacity:0;transform:translateY(10px)} 6%{opacity:1;transform:translateY(0)} 96%{opacity:1;transform:translateY(0)} 100%{opacity:1;transform:translateY(0)} }

      .rule { animation: rl 6.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes rl { 0%,100%{transform:scaleX(.35);opacity:.5} 50%{transform:scaleX(1);opacity:1} }
    </style>
  </defs>

  <g clip-path="url(#h-card)">
    <rect width="1200" height="340" fill="url(#h-bg)"/>
    <g filter="url(#h-soft)" opacity="0.55">
      <circle class="blob1" cx="240" cy="90" r="170" fill="#0088B0"/>
      <circle class="blob2" cx="980" cy="290" r="150" fill="#0088B0"/>
    </g>
    <rect width="1200" height="340" fill="url(#h-dots)"/>
    <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="21" fill="none" stroke="#3B3735" stroke-width="1.5"/>

    <!-- logo: the identity mark, drawn for a dark field -->
    <g transform="translate(56 66) scale(1.094)">
      <g fill="none" stroke="#F3F2F2" stroke-width="5.5" stroke-linejoin="miter">
        <path d="M20 8H8v48h12"/>
        <path d="M44 8h12v48H44"/>
        <path d="M22 26h20"/>
      </g>
      <path d="M22 39h13" fill="none" stroke="#62C5EE" stroke-width="5.5"/>
    </g>

    <!-- title -->
    <text class="s" x="150" y="122" font-size="56" font-weight="600" fill="#F3F2F2" letter-spacing="-0.5">Huquq <tspan fill="#62C5EE">AI</tspan></text>
    <text class="s" x="150" y="122" font-size="56" font-weight="600" fill="#ffffff" letter-spacing="-0.5" mask="url(#h-sweepmask)">Huquq AI</text>
    <text class="f" x="152" y="152" font-size="14.5" font-weight="600" fill="#948F8B" letter-spacing="3.6">HYBRID-RAG · LEX.UZ · GEMINI</text>

    <!-- typing subtitle -->
    <g class="f" font-size="21" fill="#CFCBC7">
      <text x="150" y="198" mask="url(#h-t1)" textLength="410" lengthAdjust="spacing">Oddiy savol → aniq modda → manbali javob</text>
      <text x="150" y="198" mask="url(#h-t2)" textLength="370" lengthAdjust="spacing">22 513 modda · 1 283 hujjat · 5 ta vosita</text>
      <text x="150" y="198" mask="url(#h-t3)" textLength="326" lengthAdjust="spacing">Har bir da'vo yonida lex.uz havolasi</text>
    </g>
    <g class="win w1"><rect class="caret cw c1" x="152" y="180" width="2.5" height="24" fill="#3FAFD6"/></g>
    <g class="win w2"><rect class="caret cw c2" x="152" y="180" width="2.5" height="24" fill="#3FAFD6"/></g>
    <g class="win w3"><rect class="caret cw c3" x="152" y="180" width="2.5" height="24" fill="#3FAFD6"/></g>

    <!-- metric chips -->
    <g class="f" font-size="13.5" font-weight="600">
      <g class="chip k1">
        <rect x="150" y="240" width="150" height="34" rx="17" fill="#282524" stroke="#454140"/>
        <circle cx="170" cy="257" r="4" fill="#4FB89B"/>
        <text x="184" y="262" fill="#D6D2CE">1 283 hujjat</text>
      </g>
      <g class="chip k2">
        <rect x="310" y="240" width="156" height="34" rx="17" fill="#282524" stroke="#454140"/>
        <circle cx="330" cy="257" r="4" fill="#62C5EE"/>
        <text x="344" y="262" fill="#D6D2CE">22 513 chunk</text>
      </g>
      <g class="chip k3">
        <rect x="476" y="240" width="164" height="34" rx="17" fill="#282524" stroke="#454140"/>
        <circle cx="496" cy="257" r="4" fill="#62C5EE"/>
        <text x="510" y="262" fill="#D6D2CE">7 agent rejimi</text>
      </g>
      <g class="chip k4">
        <rect x="650" y="240" width="168" height="34" rx="17" fill="#282524" stroke="#454140"/>
        <circle cx="670" cy="257" r="4" fill="#D9A441"/>
        <text x="684" y="262" fill="#D6D2CE">8 GB RAM yetadi</text>
      </g>
    </g>

    <!-- recall ring -->
    <g>
      <circle class="pulse" cx="1032" cy="170" r="86" fill="#4FB89B" opacity=".18"/>
      <circle class="spin" cx="1032" cy="170" r="80" fill="none" stroke="#403C39" stroke-width="1.5" stroke-dasharray="4 9"/>
      <circle cx="1032" cy="170" r="68" fill="none" stroke="#2E2B29" stroke-width="12"/>
      <circle class="arc" cx="1032" cy="170" r="68" fill="none" stroke="url(#h-ring)" stroke-width="12" stroke-linecap="round" transform="rotate(-90 1032 170)"/>
      <text class="f" x="1032" y="176" font-size="40" font-weight="800" fill="#E9F3EF" text-anchor="middle">0.95</text>
      <text class="f" x="1032" y="200" font-size="12.5" font-weight="600" fill="#7FB9CC" text-anchor="middle" letter-spacing="1.6">RECALL@5</text>
    </g>

    <rect class="rule" x="150" y="300" width="668" height="2.5" rx="1.25" fill="url(#h-rule)"/>
  </g>
</svg>
