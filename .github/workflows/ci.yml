name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # the CPU wheel keeps the job from downloading several gigabytes of cuda
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          pip install -r requirements-dev.txt

      - name: Tests
        run: pytest

      - name: Import check
        run: python -c "import backend.app.main"

  build:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      # the image is the deployment artefact, so a change that cannot be built is a
      # failure here rather than on the server
      - name: Build image
        run: docker build -f backend/Dockerfile -t huquq-ai:ci .

      - name: Compose files parse
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config >/dev/null
