<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Huquq AI">
  <title>Huquq AI</title>
  <!--
    Emblem-inspired, not the state emblem itself: the motifs of the national coat of arms
    (the rising sun, the wreath of wheat and cotton) are stylised around the scales of
    justice and an open code of law. A product mark has to be ours, not a reproduction of
    an official symbol.

    Proportions are set by the smallest size it is used at. The scales carry the mark and
    are drawn heavy; the sun sits behind them as an arc rather than a disc, because a
    filled circle at 34px swallowed the beam and the whole thing read as a blob.
  -->
  <defs>
    <linearGradient id="hqShield" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.5" stop-color="#13297a"/>
      <stop offset="1" stop-color="#0a1330"/>
    </linearGradient>
    <linearGradient id="hqGold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#e0850b"/>
    </linearGradient>
    <clipPath id="hqClip">
      <path d="M48 5 83 16.5V50c0 20.5-14.6 33.8-35 41.6C27.6 83.8 13 70.5 13 50V16.5L48 5z"/>
    </clipPath>
  </defs>

  <path d="M48 5 83 16.5V50c0 20.5-14.6 33.8-35 41.6C27.6 83.8 13 70.5 13 50V16.5L48 5z"
        fill="url(#hqShield)"/>

  <!-- sunrise behind the scales -->
  <g clip-path="url(#hqClip)">
    <path d="M30 30a18 18 0 0 1 36 0z" fill="url(#hqGold)" opacity="0.42"/>
    <g stroke="url(#hqGold)" stroke-width="2.4" stroke-linecap="round" opacity="0.5">
      <path d="M48 11v6M31 15.5l3 5.2M65 15.5l-3 5.2M17 26.5l5.6 2M79 26.5l-5.6 2"/>
    </g>
  </g>

  <path d="M48 10.5 78 20.4V50c0 17.6-12.4 29.3-30 36.3C30.4 79.3 18 67.6 18 50V20.4L48 10.5z"
        fill="none" stroke="url(#hqGold)" stroke-width="1.5" opacity="0.7"/>

  <!-- scales of justice: the load-bearing shape -->
  <g stroke="url(#hqGold)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 28v34" stroke-width="4.4"/>
    <path d="M25 36h46" stroke-width="4.4"/>
    <path d="M25 36 19 47M25 36l6 11M71 36l-6 11M71 36l6 11" stroke-width="2"/>
    <path d="M17.5 46.5h15a7.5 7.5 0 0 1-15 0zM63.5 46.5h15a7.5 7.5 0 0 1-15 0z"
          stroke-width="3.2"/>
    <path d="M37 62h22" stroke-width="4.4"/>
  </g>
  <circle cx="48" cy="27" r="4.2" fill="url(#hqGold)"/>

  <!-- the code of law the scales rest on -->
  <path d="M31 66h34l-3.5 11H34.5z" fill="url(#hqGold)"/>
  <path d="M48 66v11" stroke="#0a1330" stroke-width="1.8" opacity="0.5"/>
  <path d="M37.5 70h6.5M52 70h6.5" stroke="#0a1330" stroke-width="1.5"
        stroke-linecap="round" opacity="0.38"/>
</svg>
