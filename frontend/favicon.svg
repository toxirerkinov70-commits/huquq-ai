<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Huquq AI">
  <!-- A tab strip can be light or dark, so the favicon carries its own field rather than
       relying on the browser's: the kit's ink as the tile, paper for the brackets. The
       strokes are heavier than in the full mark because at 16px the drawn weight is what
       survives, not the drawing. -->
  <rect width="64" height="64" rx="12" fill="#201E1D"/>
  <g fill="none" stroke="#F3F2F2" stroke-width="6" stroke-linejoin="miter">
    <path d="M22 14H14v36h8"/>
    <path d="M42 14h8v36h-8"/>
    <path d="M25 28h14"/>
  </g>
  <path d="M25 39h9" fill="none" stroke="#62C5EE" stroke-width="6"/>
</svg>
