<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huquq AI — O'zbekiston qonunchiligi bo'yicha yordamchi</title>
<script>
// the theme must land on <html> before the first paint, or the page flashes
(function () {
  var pref = localStorage.getItem("huquq_theme") || "system";
  var dark = pref === "dark" ||
    (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
})();
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="layout">
  <button class="menu-btn" id="menu-btn" aria-label="Menyu">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>

  <div class="theme-switch" id="theme-switch" role="group" aria-label="Mavzu">
    <button data-theme-pref="light" title="Kunduzgi rejim">
      <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M18.8 5.2l-1.7 1.7M6.9 17.1l-1.7 1.7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
    </button>
    <button data-theme-pref="dark" title="Tungi rejim">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M20.4 14.2A8.4 8.4 0 0 1 9.8 3.6a8.4 8.4 0 1 0 10.6 10.6z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
    </button>
    <button data-theme-pref="system" title="Tizim rejimi">
      <svg viewBox="0 0 24 24" width="16" height="16"><rect x="3" y="4.5" width="18" height="12.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M9.5 20.5h5M12 17v3.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
    </button>
  </div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark">§</span>
      <span class="brand-name">Huquq AI</span>
    </div>

    <button class="new-chat" id="new-chat">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      Yangi suhbat
    </button>

    <nav class="nav">
      <button class="nav-item active" data-view="chat">
        <svg viewBox="0 0 24 24" width="17" height="17"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        Suhbat
      </button>
      <button class="nav-item" id="nav-search">
        <svg viewBox="0 0 24 24" width="17" height="17"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Qidiruv
      </button>
      <button class="nav-item" data-view="docs">
        <svg viewBox="0 0 24 24" width="17" height="17"><path d="M6 3h9l4 4v14H6z M14 3v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        Hujjatlar
      </button>
    </nav>

    <div class="side-section agents-section">
      <button class="side-title" id="agents-toggle" aria-expanded="true">
        <span>Agentlar</span>
        <svg class="chevron" viewBox="0 0 24 24" width="14" height="14"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="agent-list" id="agents"></div>
    </div>

    <div class="side-section sessions-section">
      <div class="side-title static">Suhbatlar</div>
      <div class="session-list" id="sessions"></div>
    </div>

    <div class="side-bottom">
      <button class="ring-toggle" id="agentic" aria-pressed="false"
              title="Model qidiruvni o'zi boshqaradi. Bazada javob topilmasa lex.uz dan real vaqtda qidiradi — sekinroq ishlaydi va javob bir bo'lak bo'lib keladi.">
        <span class="ring"></span>
        <span>Agent rejimi</span>
      </button>
      <p class="freshness" id="freshness" title="Baza lex.uz dan oxirgi marta qachon yangilangani"></p>
    </div>
  </aside>
  <div class="backdrop" id="backdrop" hidden></div>

  <main class="content">
    <section id="view-chat" class="view active">
      <div class="chat-scroll" id="chat-scroll">
        <div class="messages" id="messages"></div>
      </div>

      <div class="composer-wrap">
        <div class="attach-chip" id="attach-chip" hidden>
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M21 12.5l-8.5 8.5a6 6 0 0 1-8.5-8.5L12.5 4a4 4 0 0 1 5.7 5.7L9.7 18.2a2 2 0 0 1-2.9-2.9l7.8-7.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span id="attach-name"></span>
          <button type="button" id="attach-remove" aria-label="Faylni olib tashlash">×</button>
        </div>
        <form class="composer" id="composer">
          <button type="button" class="icon-btn" id="attach" title="Fayl biriktirish (PDF, rasm, DOCX, TXT)">
            <svg viewBox="0 0 24 24" width="19" height="19"><path d="M21 12.5l-8.5 8.5a6 6 0 0 1-8.5-8.5L12.5 4a4 4 0 0 1 5.7 5.7L9.7 18.2a2 2 0 0 1-2.9-2.9l7.8-7.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <textarea id="question" rows="1" placeholder="Savolingizni yozing..." autocomplete="off"></textarea>
          <button type="submit" class="send-btn" id="send" title="Yuborish">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 19V5m0 0l-6 6m6-6l6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
        <input type="file" id="file-input" hidden
               accept=".pdf,.png,.jpg,.jpeg,.webp,.docx,.txt,.md,application/pdf,image/png,image/jpeg,image/webp">
        <!-- every answer carries its own advisory notice; this one covers the empty
             chat, where there is no answer to attach it to -->
        <p class="disclaimer" id="composer-disclaimer">Javoblar tavsiyaviy xarakterga ega, aniq huquqiy maslahat uchun yuristga murojaat qiling.</p>
      </div>
    </section>

    <section id="view-docs" class="view">
      <div class="docs-inner">
        <h2 class="docs-heading">Hujjatlar bazasi</h2>
        <div class="docs-search">
          <input id="doc-query" type="search" placeholder="Hujjat nomi bo'yicha qidirish...">
        </div>
        <div class="doc-list" id="doc-list"></div>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <button class="modal-close" id="modal-close">×</button>
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <a id="modal-link" href="#" target="_blank" rel="noopener">lex.uz da ochish ↗</a>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="modal" id="search-modal" hidden>
  <div class="modal-card search-card">
    <button class="modal-close" id="search-close">×</button>
    <div class="search-head">
      <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="global-query" type="search" placeholder="Hujjat nomi bo'yicha qidirish..." autocomplete="off">
    </div>
    <div class="search-results" id="search-results"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
